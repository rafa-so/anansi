[package]
name = "anansi-core"
version = "0.2.0"
edition = "2021"
description = "Lógica do anansi, sem dependência do Tauri"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
deunicode = "1"
dunce = "1"
ignore = "0.4"
# HTTP: rustls com as raízes do repositório de certificados do sistema (CAs corporativas no Windows).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate", "http2", "charset"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
url = "2"
base64 = "0.22"
shell-words = "1"
notify = "8"
notify-debouncer-full = "0.5"

[dev-dependencies]
tempfile = "3"
rstest = "0.26"
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
flate2 = "1"
