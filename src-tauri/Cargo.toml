[package]
name = "anansi"
version = "0.1.0"
description = "Cliente HTTP desktop com collections versionadas em git"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "anansi_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anansi-core = { path = "crates/anansi-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [".", "crates/anansi-core"]
resolver = "2"

[profile.dev.package."*"]
# Dependências otimizadas deixam o app de desenvolvimento mais rápido sem pesar no build incremental.
opt-level = 1
